name: Semantic Release

on:
    push:
        branches:
            - main

# Least-privilege default for the workflow; job overrides as needed
permissions:
  contents: read

jobs:
    semantic-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: true
            - uses: actions/setup-node@v7
              with:
                  node-version: '26'
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Set up FFmpeg
              uses: AnimMouse/setup-ffmpeg@v1.2.5
              with:
                  version: release

            - run: ffmpeg -version
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run test
            - run: bun run test:e2e
            - run: bun run build
            - run: bun x --no-install semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
