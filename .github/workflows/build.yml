name: Bun CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Use Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: '26'
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Set up FFmpeg
              uses: AnimMouse/setup-ffmpeg@v1.2.5
              with:
                  version: release
            - run: ffmpeg -version
            - run: bun run build
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run test
            - run: bun run test:e2e
            - name: Upload results to Codecov
              uses: codecov/codecov-action@v7
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
